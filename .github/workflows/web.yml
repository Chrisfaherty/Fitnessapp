name: Web — Lint + Unit + E2E

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"

jobs:
  lint-and-unit:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web lint

      - name: Unit tests
        run: pnpm --filter web test

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: lint-and-unit

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 54322 -U postgres; then
              echo "Supabase ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Apply migrations and seed data
        # supabase start boots empty containers — db reset applies all
        # migrations + seed.sql so auth.users exists for E2E login
        run: supabase db reset

      - name: Set Supabase env vars for build
        run: |
          # Try --output env first; fall back to human-readable grep
          STATUS_ENV=$(supabase status --output env 2>/dev/null || true)
          echo "=== supabase status --output env ==="
          echo "$STATUS_ENV"
          echo "====================================="
          ANON_KEY=$(echo "$STATUS_ENV" | grep -i "^ANON_KEY" | cut -d= -f2-)
          # Fallback: human-readable format ("anon key: <value>")
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY=$(supabase status 2>&1 | grep -i "anon key" | awk '{print $NF}')
            echo "Fallback ANON_KEY length: ${#ANON_KEY}"
          fi
          if [ -z "$ANON_KEY" ]; then
            echo "ERROR: could not extract ANON_KEY — aborting"
            exit 1
          fi
          echo "ANON_KEY length: ${#ANON_KEY}"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app
        # NEXT_PUBLIC_* vars from $GITHUB_ENV are automatically available here
        run: pnpm --filter web build

      - name: Verify Supabase auth endpoint
        run: |
          echo "Supabase URL: $NEXT_PUBLIC_SUPABASE_URL"
          echo "ANON_KEY length: ${#NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          for i in {1..10}; do
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/token?grant_type=password" \
              -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"email":"trainer1@fitcoach.dev","password":"FitCoach123!"}')
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            echo "Attempt $i — HTTP $HTTP_STATUS — $BODY"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "$BODY" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); print('Auth OK, user:', d.get('user',{}).get('email','?'))"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: GoTrue auth still failing after 10 attempts"
          exit 1

      - name: Run E2E tests
        # playwright.config.ts webServer starts `next start` automatically in CI
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
