name: Backend — Migrations + DB Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/**"
      - "tests/db/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tests/db/**"

jobs:
  db-test:
    name: Supabase DB Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Used only for psql commands — supabase db test uses --local (no TLS)
      PGPASSWORD: postgres
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 54322 -U postgres; then
              echo "Supabase is ready"
              exit 0
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          echo "Supabase failed to start within 60s"
          exit 1

      - name: Apply migrations
        run: supabase db reset

      - name: Install pgTAP extension
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Run DB CRUD tests
        # --local targets the running local stack directly (no TLS negotiation)
        run: supabase db test --local tests/db/crud_test.sql

      - name: Run DB RLS tests
        run: supabase db test --local tests/db/rls_test.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop
