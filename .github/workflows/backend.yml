name: Backend — Migrations + DB Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/**"
      - "tests/db/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tests/db/**"

jobs:
  db-test:
    name: Supabase DB Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Local Supabase Postgres — sslmode=disable required (no TLS on local stack)
      DB_URL: postgresql://postgres:postgres@localhost:54322/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations
        # No --db-url: targets the local stack, no confirmation prompt
        run: supabase db reset

      - name: Run DB CRUD tests
        run: supabase db test --db-url "$DB_URL" tests/db/crud_test.sql

      - name: Run DB RLS tests
        run: |
          psql "$DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
          supabase db test --db-url "$DB_URL" tests/db/rls_test.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop
